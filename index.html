<style>
:root{--ink:#161616;--mid:#5C5C5C;--faint:#8A8A86;--bg:#FAFAF8;--line:#E0DFDA;--sea:#3B7F8F;--sea-ink:#2D6676}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 16px/1.6 -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;padding:24px}
.card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:40px 36px}
.card svg{width:64px;height:auto;display:block;margin-bottom:28px}

button{margin-top:16px;width:100%;min-height:46px;font:inherit;font-weight:500;color:#fff;background:var(--sea-ink);border:0;border-radius:999px;cursor:pointer}
button:hover{background:var(--sea)}button:disabled{opacity:.6;cursor:wait}
.msg{min-height:22px;margin:14px 0 0;font-size:14px;color:#A33A2B}
.foot{margin:28px 0 0;font-size:12.5px;color:var(--faint)}
