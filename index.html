async function now(){try{const c=new AbortController();setTimeout(()=>c.abort(),2500);const r=await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC',{signal:c.signal,cache:'no-store'});const j=await r.json();if(j.unixtime)return j.unixtime*1000;}catch(e){}return Date.now();}
if(Date.now()>end){expired();}
document.getElementById('f').addEventListener('submit',async(e)=>{e.preventDefault();msg.textContent='';go.disabled=true;
  try{
    if(await now()>end){expired();return;}
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.salt),iterations:D.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.iv),additionalData:new TextEncoder().encode(D.exp)},key,u8(D.ct));
    const html=new TextDecoder().decode(pt);try{window.goatcounter&&window.goatcounter.count&&window.goatcounter.count({path:'unlocked',title:'Portfolio unlocked',event:true});}catch(e){}await new Promise(r=>setTimeout(r,400));document.open();document.write(html);document.close();
  }catch(err){msg.textContent='That password did not work. Please check it and try again.';go.disabled=false;}
});
}
